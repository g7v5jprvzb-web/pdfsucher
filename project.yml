name: PDFSucher
options:
  bundleIdPrefix: local
  developmentLanguage: de
  deploymentTarget:
    macOS: "26.0"
packages:
  PDFSucherKit:
    path: Packages/PDFSucherKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_APP_SANDBOX: NO
targets:
  PDFSucher:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: PDFSucherKit
        product: ViewerUI
      - package: PDFSucherKit
        product: IndexKit
      - package: PDFSucherKit
        product: SearchKit
      - package: PDFSucherKit
        product: OutputKit
      - package: PDFSucherKit
        product: AppCore
      - package: PDFSucherKit
        product: OfficeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.pdfsucher
        PRODUCT_NAME: PDFSucher
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PDFSucher
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.4.3"
        CURRENT_PROJECT_VERSION: "24"
        ENABLE_HARDENED_RUNTIME: NO
    scheme:
      testTargets: [PDFSucherUITests]
  PDFSucherUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies:
      - target: PDFSucher
      - package: PDFSucherKit
        product: TestSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.pdfsucher.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PDFSucher
