# iPhone-App „PDF Search“. Eigenständiges Projekt: hängt nicht vom Mac-Paket PDFSucherKit ab.
name: PDFSearch
options:
  bundleIdPrefix: local
  developmentLanguage: de
  deploymentTarget:
    iOS: "26.0"
packages:
  PDFSearchCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
targets:
  PDFSearch:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: PDFSearchCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.pdfsearch
        PRODUCT_NAME: PDFSearch
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PDF Search
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Der Dokumente-Ordner der App erscheint in „Dateien“ unter „Auf meinem iPhone > PDF Search“.
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "PDF Search nutzt das Mikrofon nur, solange du per Sprache suchst."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "PDF Search wandelt deinen gesprochenen Suchbegriff in Text um."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
